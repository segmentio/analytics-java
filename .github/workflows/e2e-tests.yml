name: E2E Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      e2e_tests_ref:
        description: 'Branch or ref of sdk-e2e-tests to use'
        required: false
        default: 'main'

permissions:
  id-token: write
  contents: read

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}

jobs:
  e2e-tests:
    name: E2E Test Suite
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-x64

    steps:
      - name: Checkout SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          path: sdk

      - name: Checkout sdk-e2e-tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: segmentio/sdk-e2e-tests
          ref: ${{ inputs.e2e_tests_ref || 'main' }}
          path: sdk-e2e-tests

      - name: Set up JDK 11
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: maven

      - name: Artifactory OIDC
        uses: ./sdk/.github/actions/artifactory-oidc
        with:
          artifactory_url: ${{ vars.ARTIFACTORY_URL }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '20'

      - name: Build Java SDK and e2e-cli
        working-directory: sdk
        run: mvn -B package -pl e2e-cli -am -DskipTests

      - name: Find e2e-cli jar
        id: find-jar
        working-directory: sdk
        run: |
          JAR_PATH=$(find e2e-cli/target -name "e2e-cli-*-jar-with-dependencies.jar" | head -1)
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"

      - name: Run E2E tests
        working-directory: sdk-e2e-tests
        run: |
          ./scripts/run-tests.sh \
            --sdk-dir "${{ github.workspace }}/sdk/e2e-cli" \
            --cli "java -jar ${{ github.workspace }}/sdk/${{ steps.find-jar.outputs.jar_path }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-test-results
          path: sdk-e2e-tests/test-results/
          if-no-files-found: ignore
